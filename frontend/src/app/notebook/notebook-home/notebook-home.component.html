<section class="notebook">
  <header class="toolbar">
    <h2>Notebook de práctica</h2>
    <div class="toolbar-actions">
      <button class="tour-btn" (click)="startTour()" title="Ver el tour de esta pantalla otra vez">❓ Ver tour</button>
      <button class="restart" (click)="restart()">↺ Reiniciar sesión</button>
    </div>
  </header>

  @if (restoredDraft) {
    <div class="banner ok draft-banner">
      Recuperamos tu borrador de la última vez que estuviste aquí.
      <button class="discard-btn" (click)="discardDraft()">Empezar de cero</button>
    </div>
  }

  <div class="nb-layout">
    <!-- Tools: one tab at a time, beside the cells instead of above them. -->
    <aside class="nb-tools" aria-label="Herramientas">
      <div class="tool-tabs" role="tablist" aria-label="Herramientas del notebook">
        <button
          type="button"
          role="tab"
          class="tool-tab"
          data-tab="datos"
          [class.on]="toolTab === 'datos'"
          [attr.aria-selected]="toolTab === 'datos'"
          (click)="toolTab = 'datos'"
        >
          Datos
          @if (knownVariables.length > 0) {
            <span class="count">{{ knownVariables.length }}</span>
          }
        </button>
        <button
          type="button"
          role="tab"
          class="tool-tab"
          data-tab="guardadas"
          [class.on]="toolTab === 'guardadas'"
          [attr.aria-selected]="toolTab === 'guardadas'"
          (click)="toolTab = 'guardadas'"
        >
          Guardadas
          @if (snippets.length > 0) {
            <span class="count">{{ snippets.length }}</span>
          }
        </button>
        <button
          type="button"
          role="tab"
          class="tool-tab"
          data-tab="graficas"
          [class.on]="toolTab === 'graficas'"
          [attr.aria-selected]="toolTab === 'graficas'"
          (click)="toolTab = 'graficas'"
        >
          Gráficas
        </button>
      </div>

      <div class="tool-pane" role="tabpanel" [hidden]="toolTab !== 'datos'">
        <app-data-source-panel origin="notebook" (loaded)="onLoaded($event)" (message)="onMessage($event)"></app-data-source-panel>
        <app-loaded-variables [variables]="knownVariables"></app-loaded-variables>
        <p class="no-code-hint">
          ¿Prefieres ordenar, resumir o graficar sin escribir código? Usa
          <a routerLink="/sin-codigo">Sin código</a>.
        </p>
      </div>
      <div class="tool-pane" role="tabpanel" [hidden]="toolTab !== 'guardadas'">
        <app-saved-queries [snippets]="snippets" (insert)="insertCode($event)" (remove)="onRemoveSnippet($event)"></app-saved-queries>
      </div>
      <div class="tool-pane" role="tabpanel" [hidden]="toolTab !== 'graficas'">
        <app-chart-helper [variables]="knownVariables" (insert)="insertCode($event)"></app-chart-helper>
      </div>
    </aside>

    <div class="nb-cells">
      @for (cell of cells; track $index) {
        <app-code-cell
          [code]="cell.code"
          [result]="cell.result"
          [running]="cell.running"
          [removable]="cells.length > 1"
          [allowSave]="true"
          (codeChange)="cell.code = $event"
          (run)="runCell($index, $event)"
          (remove)="removeCell($index)"
          (save)="onSaveSnippet($event)"
        ></app-code-cell>
      }

      <button class="add-cell" (click)="addCell()">+ Agregar celda</button>
    </div>
  </div>
</section>
