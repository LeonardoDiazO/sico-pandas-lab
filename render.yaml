services:
  - name: sico-pandas-lab-backend
    type: web
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CELL_TIMEOUT_SECONDS
        value: 15
      - key: FLASK_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: 15
      # Plan free = 512 MB: el proceso Flask + 2 workers con pandas ya lo llenan.
      - key: MAX_SESSIONS
        value: 2
      # Firma de los ids de sesión: Render genera un valor aleatorio estable.
      - key: SECRET_KEY
        generateValue: true
      # Clave compartida del equipo: se define a mano en el dashboard de
      # Render (nunca en el repo). Sin ella el acceso queda abierto.
      - key: APP_ACCESS_KEY
        sync: false
      # SICO_DB_* deliberadamente NO se define: el módulo de conexión a la RDS
      # de sico queda deshabilitado por ahora, se trabaja solo con Excel subido.
      # El backend arranca igual sin estas variables (ver app/startup_checks.py).

  - name: sico-pandas-lab-frontend
    type: web
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: Dockerfile
    dockerContext: .
